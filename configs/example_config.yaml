model:
  patch_size: 16
  tubelet_size: 1
  embed_dim: 768
  spatial_num_heads: 12
  spatial_num_layers: 12
  spatial_mlp_dim: 2048
  temporal_num_heads: 12
  temporal_num_layers: 12
  temporal_mlp_dim: 2048
  num_classes: 8
  max_seq_length: 16
  image_size: 224
  use_vit: False  # To use ViT encoder with Conv2d instead of tubelet with Conv3d. ViT is automatically pretrained on Imagenet.

data:
  dataset_type: stream  # [one_class, stream]
  min_sequence_length: 2  # for one_class only
  max_sequence_length: 16  # for one_class only
  context_size: 8  # for stream only
  overlap: 2  # for stream only
  max_empty_frames: 3  # for stream only
  frame_sample_rate: 1
  num_channels: 3
  height: 224
  width: 224
  train_meta_file: example_data_RAVDAI/annotations.json
  val_meta_file: example_data_RAVDAI/annotations.json
  test_meta_file: example_data_RAVDAI/annotations.json
  train_json: none
  val_json: none
  test_json: none
  shuffle: True
  drop_last: True
  batch_size: 2
  num_workers: 0
  decord_num_threads: 2

training:
  seed: 42
  learning_rate: 0.0025
  warmup_epochs: 2.5
  lr_scheduler: cosine  # ["cosine", "constant", "multistep"]
  optimizer: sgd  # ["adam, sgd"]
  epochs: 50
  log_step: 50
  eval_step: 50
  save_step: 50
  checkpoint_save_dir: checkpoints/
  load_from_checkpoint: none
  load_only_weights: False
  report_to: none  # ["wandb", None]
  balance_dataset: False  # Randomly sample dataset so every class has the same number of instances

evaluation:
  checkpoint: checkpoints/model.pt
  dataset_meta_file: example_data_RAVDAI/annotations.json
